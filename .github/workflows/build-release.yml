name: Build & Release & jar
on:
  workflow_dispatch:
  # 如果需要私有仓库tag推送自动触发，不要在这里写tags/push；改用repository_dispatch触发
  # push:
  #   tags:
  #     - 'v*'

permissions:
  contents: write

jobs:
  build-native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: linux-amd64
          - target: aarch64-unknown-linux-gnu
            name: linux-arm64
    steps:
      # 👉 替换：拉取私有仓库源码，不再checkout当前builder仓库
      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: tserverjs/rust-argo-jar
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: ./src

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Rust binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cd ./src/rust-core
          cargo build --release --target ${{ matrix.target }}
          mkdir -p ../../dist
          cp target/${{ matrix.target }}/release/web ../../dist/web-${{ matrix.name }}

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.name }}
          path: dist/web-${{ matrix.name }}
          retention-days: 7

  build-jar:
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      # 再次拉取私有仓库完整源码
      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: YOUR_USER/YOUR_PRIVATE_REPO
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: ./src

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./src/java-wrapper/src/main/resources/natives
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x ./src/java-wrapper/src/main/resources/natives/*

      - name: Copy index.html into wrapper resources
        run: cp ./src/index.html ./src/java-wrapper/src/main/resources/index.html

      - name: Build JAR with Maven
        run: |
          cd ./src/java-wrapper
          mvn clean package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: ./src/java-wrapper/target/server-1.0.0.jar
          retention-days: 7

      - name: Rename JAR for release
        run: cp ./src/java-wrapper/target/server-1.0.0.jar server.jar

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-jar-final
          path: server.jar
          retention-days: 7

  release:
    needs: build-jar
    runs-on: ubuntu-latest
    # ⚠️注意：原github.ref是builder仓库的ref，不是私有仓库tag！
    # 直接tag触发私有仓库的模式不再适用；
    # 方案A：手动workflow_dispatch手动打release；
    # 方案B：通过repository_dispatch传递tag版本号输入参数。
    # if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: server-jar-final
          path: .

      - name: Create Release in Public Builder Repo
        uses: softprops/action-gh-release@v2
        with:
          files: server.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
